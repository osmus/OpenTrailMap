<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>OpenTrailMap by OpenStreetMap US</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <style>
      @font-face{
        src: url('css/fonts/NationalPark-Bold.otf');
        font-family: "National Park";
        font-weight: 700;
      }
      @font-face{
        src: url('css/fonts/NationalPark-Regular.otf');
        font-family: "National Park";
        font-weight: 400;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "National Park", "Source Sans", "Helvetica", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      #map {
        flex: 1;
      }
      #footer {
        height: 26px;
        color: #FFE2A8;
        display: flex;
        align-items: center;
        background: #4f2e28;
        padding: 0 8px;
        font-size: 14px;
        white-space: nowrap;
      }
      #footer a {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: inherit;
      }
      #footer a:hover {
        text-decoration: underline;
      }
      #footer img {
        height: 16px;
        width: 16px;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="footer">
    <a href="https://opentrailmap.us" target="_blank"><img src="img/opentrailmap-logo.svg" alt="OpenTrailMap logo"/><b>OpenTrailMap</b></a>
      <span>&nbsp;by <a href="https://openstreetmap.us" target="_blank">OpenStreetMap US</a></span>
    </div>
    <script type="module" src="js/embed.js"></script>
  </body>
</html>
