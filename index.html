<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>OpenTrailMap by OpenStreetMap US</title>
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link href="css/reset.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet" />
    <script async src="https://analytics.openstreetmap.us/js/pa-Rg1FovK4zxBRjNR6MzWn5.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||((i)=> {plausible.o=i||{}});
      plausible.init()
    </script>
  </head>
  <body>
    <div id="header">
      <div class="site-title">
        <a href="/"><img src="img/opentrailmap-logo.svg" alt="Stick figure hiker with walking stick and backpack above a dashed line surrounded by a map outline"/> <h1>OpenTrailMap</h1></a> <p class="tagline">by <a href="https://openstreetmap.us" target="_blank">OpenStreetMap US</a></p>
      </div>
      <ul class="main-menu">
        <li><a href="https://openstreetmap.us/our-work/trails/" target="_blank">About</a></li>
        <li><a href="https://github.com/osmus/OpenTrailMap" target="_blank">GitHub</a></li>
        <li><a href="https://openstreetmap.app.neoncrm.com/forms/trails-stewardship-initiative" target="_blank">Donate</a></li>
      </ul>
    </div>
    <div id="body">
      <div id="map-wrap">
        <button type="button" id="inspect-toggle" title="Close sidebar" aria-label="Close sidebar"></button>
        <div id="controls">
          <select id="travel-mode" aria-label="Travel mode"></select>
          <select id="lens" aria-label="Attribute lens"></select>
        </div>
        <div id="map"></div>
        <div id="zoom-message" style="display:none;">Zoom in to see trail data</div>
      </div>
      <div id="sidebar"></div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
